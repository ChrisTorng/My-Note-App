plugins { id 'com.android.application' }

android {
    namespace 'tw.idv.christorng.mynoteapp'
    compileSdk 35
    defaultConfig {
        applicationId 'tw.idv.christorng.mynoteapp'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
}
// Runtime dependencies: none. Uses the Android SDK, SQLite, HttpURLConnection and Keystore only.
